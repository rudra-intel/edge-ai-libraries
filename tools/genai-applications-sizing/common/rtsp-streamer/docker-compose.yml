services:
  rtsp-server:
    image: bluenviron/mediamtx:1.15.6
    container_name: rtsp-server
    restart: unless-stopped
    ports:
      - "${RTSP_PORT:-8554}:8554"

  rtsp-streamer:
    image: jrottenberg/ffmpeg:7.0-alpine
    container_name: rtsp-streamer
    restart: unless-stopped
    depends_on:
      - rtsp-server
    environment:
      # A public video URL or a path to a file mounted under /media
      VIDEO_INPUT: ${VIDEO_URL:-/media/video.mp4}
      STREAM_NAME: ${STREAM_NAME:-video}
      STREAM_LOOP: ${STREAM_LOOP:-true}
      RTSP_PORT: "8554"
    volumes:
      - ${MEDIA_DIR_HOST:-./media}:/media
    entrypoint:
      - sh
      - -c
      - |
        loop=""
        [ "$$STREAM_LOOP" = "true" ] && loop="-stream_loop -1"
        echo "Streaming $$VIDEO_INPUT to rtsp://rtsp-server:$$RTSP_PORT/$$STREAM_NAME"
        exec ffmpeg -hide_banner -loglevel info -re $$loop \
          -i "$$VIDEO_INPUT" \
          -c copy -rtsp_transport tcp -f rtsp \
          "rtsp://rtsp-server:$$RTSP_PORT/$$STREAM_NAME"
